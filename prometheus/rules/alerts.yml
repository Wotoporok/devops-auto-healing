groups:
  - name: infrastructure

    rules:

      - alert: HighCPUUsage
        expr: |
          100 - (
            avg by(instance) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            ) * 100
          ) > 80

        for: 2m

        labels:
          severity: warning

        annotations:
          summary: "High CPU usage"
          description: "CPU usage on {{ $labels.instance }} is above 80%."


      - alert: TargetDown
        expr: up == 0

        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "Monitoring target is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} is down."


      - alert: DiskSpaceHigh
        expr: |
          (
            1 -
            node_filesystem_avail_bytes{
              mountpoint="/",
              fstype!~"tmpfs|overlay"
            }
            /
            node_filesystem_size_bytes{
              mountpoint="/",
              fstype!~"tmpfs|overlay"
            }
          ) * 100 > 80

        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High disk usage"
          description: "Root filesystem on {{ $labels.instance }} is above 80%."
